<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Island</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,system-ui,Roboto,sans-serif}

.island{position:absolute;top:0;left:50%;width:130px;height:38px;border-radius:19px;overflow:hidden;
  transform:translateX(-50%);transform-origin:top center;
  background:rgba(5,5,9,.95);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.32),inset 0 -6px 12px rgba(255,255,255,.04),
             0 10px 30px rgba(0,0,0,.5);
  color:#fff;will-change:width,height,border-radius;cursor:pointer}
.island::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 34%,
             rgba(255,255,255,0) 70%,rgba(255,255,255,.1))}

.content{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 14px;
  opacity:0;transform:scale(.9);
  transition:opacity .16s ease,transform .34s cubic-bezier(.2,1.45,.4,1)}
.content.in{opacity:1;transform:scale(1)}

.col{display:flex;flex-direction:column;min-width:0;flex:1}
.t1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-weight:600;font-size:17px;background:linear-gradient(135deg,#7aa7ff,#c07bff)}
.av.sm{width:28px;height:28px;font-size:12px}

.btn{width:42px;height:42px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;
  cursor:pointer;flex:none;padding:0;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.btn:active{transform:scale(.84)}
.btn svg{width:19px;height:19px;fill:#fff;pointer-events:none}
.red{background:#ff453a}.green{background:#30d158}

.wave{display:flex;gap:2px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:#30d158;animation:w .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:5px}50%{height:18px}}
.ring{width:10px;height:10px;border-radius:50%;background:#30d158;flex:none;animation:p 1.2s ease-out infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(48,209,88,.7)}100%{box-shadow:0 0 0 10px rgba(48,209,88,0)}}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.bars i{width:3px;height:8px;background:#ff6fa8;border-radius:2px;animation:w .7s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
.paused .bars i{animation-play-state:paused;height:6px}

.rows{display:flex;flex-direction:column;gap:8px;width:100%}
.r1{display:flex;align-items:center;gap:10px}
.r2{display:flex;justify-content:space-around;align-items:center}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s}
.ib:active{transform:scale(.82)}
.ib svg{width:19px;height:19px;fill:#fff;pointer-events:none}
.ib.act{background:#fff}.ib.act svg{fill:#000}
.ib.red{background:#ff453a}

/* The control room has honoured "Remove animations" since the first pass: with
   the setting on, its drifting orbs, level meters, waveform and pulsing call dot
   are all switched off and the content fades in quickly instead of springing.
   This page - the one that is actually on screen over every other app - never
   had the rule, so the same user saw the preview holding still and the floating
   island waving and pulsing at them from the top of the screen, and paid for
   three infinite animations in a window that is above everything else, for as
   long as a call or a track was up. The animations here are the same three the
   preview switches off, so they are switched off the same way; the static
   heights each bar is left at are the ones the keyframes start from, so the
   island is the shape it always is when it is not moving. Nothing changes for
   anyone who has not asked the system for reduced motion. */
@media (prefers-reduced-motion:reduce){
  .wave i,.bars i,.ring{animation:none!important}
  .content{transition:opacity .1s linear}
  .btn,.ib{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="island" id="island" role="group" aria-label="Dynamic Island"><div class="content" id="content"></div></div>
<script>
(function(){
  'use strict';
  var N = window.Native || null;
  function resize(w,h){ try{ if(N && N.resize) N.resize(Math.round(w), Math.round(h)); }catch(e){} }
  function haptic(k){ try{ if(N && N.haptic) N.haptic(k||'light'); }catch(e){} }
  function callReady(){ try{ if(N && N.ready) N.ready(); }catch(e){} }

  var island = document.getElementById('island'), content = document.getElementById('content');
  var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

  var BASE = {
    idle:{w:130,h:38}, notif:{w:318,h:94}, incoming:{w:312,h:88},
    calling:{w:274,h:66}, ongoing:{w:318,h:118}, music:{w:318,h:128}
  };
  var S = { wm:1, hm:1, rm:1, bounce:.65 };
  var maxW = 320;   /* the native side tells us how wide we are allowed to be */

  /* ---- springs ---- */
  function Spring(v){ this.x=v; this.v=0; this.t=v; }
  /* one fixed integration step; the loop below decides how many a frame owes */
  Spring.prototype.step=function(dt,k,c){
    var a=-k*(this.x-this.t)-c*this.v; this.v+=a*dt; this.x+=this.v*dt;
  };
  var spW=new Spring(130), spH=new Spring(38), spR=new Spring(19);
  var DAMP={w:0,h:0,r:0};
  function recomputeDamping(){
    var z=clamp(.95-.80*S.bounce,.12,1.02);
    DAMP.w=2*z*Math.sqrt(175);
    DAMP.h=2*z*Math.sqrt(235);
    DAMP.r=2*z*Math.sqrt(175);
  }

  /* This page lives in a system overlay window, and Android throttles frames
     for a window it does not consider foreground far harder than it does for
     an app - frames arrive late and in clumps, not sixty a second. The loop
     used to clamp each frame to 32 ms and integrate that, so a morph ran at
     whatever speed the frames happened to arrive: the island crept between
     sizes, and on a throttled window it was still wobbling well after the tap
     that started it. The step is fixed and time is banked instead, so the
     frame rate decides how smooth the morph looks, not how long it takes. At
     60 fps this is the same four 1/240 s steps it always ran. The bank is
     capped so a window frozen while the screen was off cannot come back and
     spin the loop for thousands of steps at once. */
  var STEP=1/240, MAX_STEPS=48;          /* at most 200 ms of catch-up per frame */
  var raf=null, lastT=0, bank=0, settleT=null, settledW=130, settledH=38;
  function unsettled(){
    return Math.abs(spW.x-spW.t)>.05||Math.abs(spW.v)>.05||
           Math.abs(spH.x-spH.t)>.05||Math.abs(spH.v)>.05||
           Math.abs(spR.x-spR.t)>.05||Math.abs(spR.v)>.05;
  }
  var shown={w:'',h:'',r:''};
  function paint(){
    var w=clamp(spW.x,20,maxW), h=clamp(spH.x,14,240), r=clamp(spR.x,6,h/2);
    var sw=w.toFixed(2)+'px', sh=h.toFixed(2)+'px', sr=r.toFixed(2)+'px';
    if(sw!==shown.w){ island.style.width=sw; shown.w=sw; }
    if(sh!==shown.h){ island.style.height=sh; shown.h=sh; }
    if(sr!==shown.r){ island.style.borderRadius=sr; shown.r=sr; }
  }
  function frame(now){
    raf=null;
    var dt=lastT?(now-lastT)/1000:STEP*4; lastT=now;
    if(!(dt>0)) dt=STEP*4;               /* a timestamp that went backwards */
    bank+=dt;
    var n=0;
    while(bank>=STEP && n<MAX_STEPS){
      spW.step(STEP,175,DAMP.w);
      spH.step(STEP,235,DAMP.h);
      spR.step(STEP,175,DAMP.r);
      bank-=STEP; n++;
    }
    /* too much backlog to be worth chasing: drop it, do not fall behind for ever */
    if(n===MAX_STEPS) bank=0;
    paint();
    if(unsettled()){ raf=requestAnimationFrame(frame); }
    else {
      lastT=0;
      /* shrink the native window down to the island once it has stopped */
      var w=Math.round(spW.x), h=Math.round(spH.x);
      if(w!==settledW||h!==settledH){ settledW=w; settledH=h; resize(w,h); }
      disarmSettle();
    }
  }
  function kick(){ if(raf===null){ lastT=0; raf=requestAnimationFrame(frame); } }
  /* frames can be throttled (screen off, host detached, heavy device). Settle
     anyway so the island is never stranded at an in-between size. */
  function snapAll(){
    spW.x=spW.t; spH.x=spH.t; spR.x=spR.t;
    spW.v=spH.v=spR.v=0;
    if(raf!==null){ cancelAnimationFrame(raf); raf=null; }
    lastT=0; bank=0; paint();
    var w=Math.round(spW.x), h=Math.round(spH.x);
    if(w!==settledW||h!==settledH){ settledW=w; settledH=h; resize(w,h); }
  }
  function armSettle(){ if(settleT) clearTimeout(settleT); settleT=setTimeout(function(){ settleT=null; snapAll(); },1500); }
  /* The backstop exists for frames that stop arriving, so the loop never gets
     to settle itself. It was never cancelled when the loop DID settle, so every
     morph left a live timer behind for the rest of its 1.5 s - and a tap in
     that window that starts a small wobble of its own (play, mute, next, a
     media push from the service) is not a state change, arms nothing, and
     inherited the stale one. At 1.5 s it fired mid-wobble and snapped the
     island to its final size, and this page is the one on screen over other
     apps, so the jump is the one the user sees. Disarmed when the springs come
     to rest; if frames really do stop, frame() never runs and the timer lives
     on to do its job. */
  function disarmSettle(){ if(settleT){ clearTimeout(settleT); settleT=null; } }
  /* The island is drawn inside a native window cut to its own size, so a morph
     that makes it bigger has to grow the window first or the island is clipped
     at the old window's edges for the whole animation. setState did this; the
     size sliders went through __setConfig, which only moved the targets, so
     dragging Width or Height up on the floating island morphed it inside a
     window still sized for the old box and the growing pill was cut off on all
     four sides until the springs stopped and the settle resized it. Growing the
     window early is invisible - it is transparent and the island is centred in
     it - and it is what every path that can make the island bigger now does. */
  function ensureWindow(){
    var needW=Math.max(spW.x,spW.t), needH=Math.max(spH.x,spH.t);
    if(needW>settledW||needH>settledH){
      settledW=Math.round(needW); settledH=Math.round(needH);
      resize(settledW,settledH);
    }
  }

  var state='idle', lastOpen='music', swapT=null, token=0, notifT=null;
  var notifData=['','',''];
  var callData={ name:'Maya Chen', label:'Incoming call…', real:false };
  /* when a real player is running these come from its media session */
  var musicData={ title:'Glass Hours', artist:'Neon Tide', playing:true, real:false };
  var ti=0, playing=true, callTick=null, callStart=0, callNode=null;
  /* The call timer used to count its own ticks (secs++ once a second), which
     assumes the window is never throttled. It is: this page lives in a system
     overlay window, and Android throttles timers for a WebView it does not
     consider foreground - a call left running behind another app came back
     minutes behind the real call. It reads the wall clock now, so a missed
     tick only delays the redraw, and the node it writes into is looked up once
     per call instead of once a second. */
  function paintCallTime(){
    if(!callNode) return;
    var s=Math.floor((Date.now()-callStart)/1000);
    if(s<0) s=0;
    callNode.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
  }

  var P={mic:'M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z',
    spk:'M3 9v6h4l5 5V4L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z',
    play:'M8 5v14l11-7z', pause:'M6 5h4v14H6zm8 0h4v14h-4z',
    prev:'M6 6h2v12H6zm3.5 6 8.5 6V6z', next:'M16 6h2v12h-2zM6 18l8.5-6L6 6z'};
  function ic(k){ return '<svg viewBox="0 0 24 24"><path d="'+P[k]+'"/></svg>'; }
  var PHONE='<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.56 3.5a1 1 0 0 1-.25 1z"/></svg>';
  var TRACKS=[['Glass Hours','Neon Tide'],['Soft Focus','Lumen'],['Bounce Theory','Spring Club']];

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var VIEWS={
    idle:function(){ return ''; },
    notif:function(){
      var letter=(notifData[0]||'?').charAt(0).toUpperCase();
      return '<div class="av">'+esc(letter)+'</div>'+
        '<div class="col"><span class="t1">'+esc(notifData[1]||notifData[0])+'</span>'+
        '<span class="t2">'+esc(notifData[2]||notifData[0])+'</span></div>';
    },
    incoming:function(){
      var n=String(callData.name||'Maya Chen');
      return '<div class="av">'+esc(n.charAt(0).toUpperCase())+'</div>'+
        '<div class="col"><span class="t1">'+esc(n)+'</span>'+
        '<span class="t2">'+esc(callData.label||'Incoming call…')+'</span></div>'+
        '<button class="btn red" data-a="decline" aria-label="Decline">'+PHONE+'</button>'+
        '<button class="btn green" data-a="accept" aria-label="Accept">'+PHONE+'</button>';
    },
    calling:function(){
      return '<div class="av sm">J</div>'+
        '<div class="col"><span class="t1">Calling Jordan…</span><span class="t2">Ringing</span></div>'+
        '<button class="btn red" style="width:32px;height:32px" data-a="end" aria-label="End">'+PHONE+'</button>';
    },
    ongoing:function(){
      return '<div class="rows"><div class="r1"><div class="ring"></div>'+
        '<span class="t1" data-role="time" style="flex:1">00:00</span>'+
        '<div class="wave"><i></i><i></i><i></i><i></i></div></div>'+
        '<div class="r2">'+
        '<button class="ib" data-a="mute" aria-label="Mute" aria-pressed="false">'+ic('mic')+'</button>'+
        '<button class="ib" data-a="speaker" aria-label="Speaker" aria-pressed="false">'+ic('spk')+'</button>'+
        '<button class="ib red" data-a="end" aria-label="End call">'+PHONE+'</button>'+
        '</div></div>';
    },
    music:function(){
      var t = musicData.real ? musicData.title : TRACKS[ti][0];
      var a = musicData.real ? musicData.artist : TRACKS[ti][1];
      var on = musicData.real ? musicData.playing : playing;
      return '<div class="rows'+(on?'':' paused')+'"><div class="r1">'+
        '<div class="av" style="border-radius:12px;background:linear-gradient(135deg,#ff6fa8,#ffb35c)">♪</div>'+
        '<div class="col"><span class="t1">'+esc(t)+'</span><span class="t2">'+esc(a)+'</span></div>'+
        '<div class="bars"><i></i><i></i><i></i></div></div>'+
        '<div class="r2">'+
        '<button class="ib" data-a="prev" aria-label="Previous">'+ic('prev')+'</button>'+
        '<button class="ib" data-a="play" aria-label="'+(on?'Pause':'Play')+'">'+ic(on?'pause':'play')+'</button>'+
        '<button class="ib" data-a="next" aria-label="Next">'+ic('next')+'</button>'+
        '</div></div>';
    }
  };

  function targets(){
    var b=BASE[state]||BASE.idle;
    spW.t=Math.min(b.w*S.wm,maxW);
    spH.t=b.h*S.hm;
    spR.t=Math.min(spH.t/2,38)*S.rm;
  }
  /* `force` is for a repeated state that carries new data (another call, another
     notification); a bare repeat of the state already on screen has nothing to
     redraw, and rebuilding it costs a fade, a re-raster of the window and a
     restart of the call timer.
     `silent` is for a change that nobody's hand asked for. The buzz at the end
     of this function belongs to a gesture: something was tapped and the phone
     acknowledges it. But this page is driven from three other places that are
     not a tap on it, and all three buzzed anyway - so the island vibrated for
     things the user had not done to it. The app's own controls push their state
     across the bridge (__setState), which the preview has already buzzed for a
     few milliseconds earlier: one chip, two vibrations. A rebuilt page replays
     the state it was showing when the renderer died, so Android reclaiming the
     WebView vibrated the phone with nothing on screen to explain it. And every
     state that ends itself - a notification's seven seconds running out, a
     track stopping in another app, the caller hanging up - ran the collapse
     through here and buzzed again, so the island going away quietly was felt
     as a tap. None of those is new information and none of them is a gesture;
     they now run the same morph in the same time to the same pixels with the
     motor left alone. A tap on the island, a call arriving and a notification
     arriving still buzz exactly as they did, because those are the three
     things that really do arrive at the user. */
  function setState(next, force, silent){
    if(!BASE[next]) next='idle';
    if(next===state && !force) return;
    if(next!==state){ if(state!=='idle') lastOpen=state; state=next; }
    if(callTick){ clearInterval(callTick); callTick=null; callNode=null; }
    if(notifT){ clearTimeout(notifT); notifT=null; }
    targets();
    /* grow the native window first so nothing is clipped while it morphs */
    ensureWindow();
    kick(); armSettle();

    var my=++token;
    content.classList.remove('in');
    if(swapT) clearTimeout(swapT);
    swapT=setTimeout(function(){
      if(my!==token) return;
      content.innerHTML=VIEWS[state]();
      if(state!=='idle') setTimeout(function(){ if(my===token) content.classList.add('in'); },20);
      if(state==='ongoing'){
        callStart=Date.now();
        callNode=content.querySelector('[data-role="time"]');
        callTick=setInterval(paintCallTime,1000);
      }
      /* the notification dismissing itself is not a tap on anything */
      if(state==='notif') notifT=setTimeout(function(){ setState('idle',false,true); },7000);
    }, state==='idle'?130:110);
    if(!silent) haptic(state==='idle'?'light':'medium');
    try{ if(N && N.stateChanged) N.stateChanged(state); }catch(e){}
  }

  island.addEventListener('click',function(e){
    var a=e.target.closest('[data-a]');
    if(a){
      var act=a.dataset.a;
      if(act==='accept'){
        if(callData.real){ try{ if(N&&N.callAction) N.callAction('accept'); }catch(e){} callData.real=false; }
        setState('ongoing');
      }
      else if(act==='decline'||act==='end'){
        if(callData.real){ try{ if(N&&N.callAction) N.callAction('decline'); }catch(e){} callData.real=false; }
        setState('idle');
      }
      else if(act==='mute'||act==='speaker'){
        /* The only sign that Mute or Speaker is on is the button turning from
           translucent to solid white, which is a colour and nothing else: a
           screen-reader user could tap it all day and never learn whether it
           took. The preview in the app has carried aria-pressed on these two
           buttons since the first pass and flips it here as well; the page
           that is actually on screen over other apps did not, so the same two
           buttons reported their state in one island and were silent in the
           other. Set from the same toggle that paints them, so what a blind
           user hears is exactly what a sighted user sees. */
        var on = a.classList.toggle('act');
        a.setAttribute('aria-pressed', on ? 'true' : 'false');
        spH.v+=24; kick(); haptic();
      }
      else if(act==='play'){
        if(musicData.real){
          var want=musicData.playing?'pause':'play';
          musicData.playing=!musicData.playing;
          try{ if(N&&N.media) N.media(want); }catch(e){}
        } else {
          playing=!playing;
        }
        var nowOn = musicData.real ? musicData.playing : playing;
        a.innerHTML=ic(nowOn?'pause':'play');
        a.setAttribute('aria-label', nowOn?'Pause':'Play');
        var rows=content.querySelector('.rows');
        if(rows) rows.classList.toggle('paused',!nowOn);
        spH.v+=24; kick(); haptic();
      }
      else if(act==='prev'||act==='next'){
        if(musicData.real){
          try{ if(N&&N.media) N.media(act==='next'?'next':'prev'); }catch(e){}
        } else {
          ti=(ti+(act==='next'?1:TRACKS.length-1))%TRACKS.length;
          var t1=content.querySelector('.col .t1'), t2=content.querySelector('.col .t2');
          if(t1) t1.textContent=TRACKS[ti][0];
          if(t2) t2.textContent=TRACKS[ti][1];
        }
        spW.v+=55; kick(); haptic();
      }
      e.stopPropagation();
      return;
    }
    if(state==='idle'){ setState(lastOpen||'music'); spW.v+=240; spH.v+=160; kick(); }
    else { setState('idle'); spW.v-=180; spH.v-=100; kick(); }
    e.stopPropagation();
  });

  /* ---- hooks called from the native side ---- */
  /* the app's preview drives the floating island through here: the user picked
     the state in the control room and already felt that buzz there, so this
     page redraws without adding a second one. A rebuilt page replays its last
     state through the same call, and that is not a gesture at all. */
  window.__setState=function(s){ setState(String(s),false,true); };
  window.__setConfig=function(wm,hm,rm,b){
    if(typeof wm==='number') S.wm=wm;
    if(typeof hm==='number') S.hm=hm;
    if(typeof rm==='number') S.rm=rm;
    if(typeof b==='number'){ S.bounce=b; recomputeDamping(); }
    targets(); ensureWindow(); kick(); armSettle();
  };
  window.__setMax=function(px){
    if(typeof px==='number' && px>80){ maxW=px; targets(); ensureWindow(); kick(); }
  };
  /* re-report the box after the window is re-attached (app went to background) */
  window.__reportSize=function(){
    settledW=Math.round(spW.x); settledH=Math.round(spH.x);
    resize(settledW, settledH);
  };
  window.__call=function(name,label){
    callData={ name:(name||'Unknown'), label:(label||'Incoming call'), real:true };
    setState('incoming', true);
  };
  window.__callEnd=function(){
    callData.real=false;
    /* the phone stopped ringing or the other side hung up: the island goes
       away on its own, so it goes away without a buzz */
    if(state==='incoming'||state==='ongoing') setState('idle',false,true);
  };
  /* A call and a notification own the island until they finish. The player is
     polled every 1.5 s, and every one of those polls used to hand the island
     back to the music view: a notification that had seven seconds on screen
     lived one and a half, and a ringing call lost its green and red buttons
     while the phone was still ringing. The player keeps its data fresh and
     waits for idle - the next poll brings it back the moment the call ends or
     the notification dismisses. */
  var OWNS_ISLAND = { incoming:1, ongoing:1, calling:1, notif:1 };
  /* A call outranks everything else, and a notification used to be the one
     thing that outranked a call. A message that arrived while the phone was
     ringing took the island from it: the green and red buttons vanished
     mid-ring, and when the notification's seven seconds were up the island
     collapsed to idle and the call was gone for good - the buttons only come
     back if the phone announces the call a second time, which it does not.
     The same thing happened to a call already in progress: its timer view was
     replaced and then dropped, while the call itself went on. The player
     already waits its turn behind a call; a notification waits now too, and
     it is not lost by waiting - it is in the shade, which is where it was
     anyway, and this island never claimed to replace it. */
  var CALL_OWNS_ISLAND = { incoming:1, ongoing:1, calling:1 };

  window.__music=function(title,artist,isPlaying){
    var changed = (title!==musicData.title) || (artist!==musicData.artist);
    musicData={ title:(title||'Now playing'), artist:(artist||''), playing:!!isPlaying, real:true };
    playing = !!isPlaying;
    if(state!=='music'){
      if(OWNS_ISLAND[state]) return;
      setState('music');
    }
    else if(changed){
      var t1=content.querySelector('.col .t1'), t2=content.querySelector('.col .t2');
      if(t1) t1.textContent=musicData.title;
      if(t2) t2.textContent=musicData.artist;
    }
    var b=content.querySelector('[data-a="play"]');
    if(b){
      /* the player is polled every couple of seconds and reports the same song
         again and again; rebuilding the svg each time throws away a node and
         forces a style recalc plus a re-raster of the whole window. The label
         already says which icon belongs here, so only redraw when it changes. */
      var label=musicData.playing?'Pause':'Play';
      if(b.getAttribute('aria-label')!==label){
        b.innerHTML=ic(musicData.playing?'pause':'play');
        b.setAttribute('aria-label', label);
      }
    }
    var rows=content.querySelector('.rows');
    if(rows) rows.classList.toggle('paused',!musicData.playing);
  };
  window.__musicEnd=function(){
    /* the player stopped somewhere else; nothing was tapped here */
    if(musicData.real){ musicData.real=false; if(state==='music') setState('idle',false,true); }
  };
  window.__notify=function(app,title,text){
    if(CALL_OWNS_ISLAND[state]) return;   /* a call owns the island until it ends */
    notifData=[app||'',title||'',text||''];
    setState('notif', true);
  };

  recomputeDamping();
  targets();
  paint();
  resize(Math.round(spW.t),Math.round(spH.t));
  callReady();
  setTimeout(function(){ spW.v+=180; spH.v+=70; kick(); },260);
})();
</script>
</body>
</html>
